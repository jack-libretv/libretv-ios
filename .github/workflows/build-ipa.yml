name: build-unsigned-ipa

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen 与 ldid
        run: |
          brew install xcodegen
          brew install ldid || (brew tap ProcursusTeam/ldid && brew install ProcursusTeam/ldid/ldid) || true
          which ldid || echo "no ldid, fallback to codesign ad-hoc"

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译（不签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project LibreTVShell.xcodeproj \
            -scheme LibreTVShell \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 伪签名（越狱机需要有效签名页，不需要证书）
        run: |
          APP=build/Build/Products/Release-iphoneos/LibreTV.app
          ENT=ent.plist
          cat > $ENT <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>platform-application</key>
            <true/>
            <key>com.apple.private.security.no-container</key>
            <true/>
            <key>com.apple.private.skip-library-validation</key>
            <true/>
            <key>get-task-allow</key>
            <true/>
          </dict>
          </plist>
          EOF
          if command -v ldid >/dev/null 2>&1; then
            echo "== ldid 伪签名 =="
            ldid -S$ENT "$APP/LibreTV"
            ldid -S$ENT "$APP"
          else
            echo "== codesign ad-hoc 签名 =="
            codesign --force --sign - --entitlements $ENT "$APP/LibreTV" || true
            codesign --force --deep --sign - --entitlements $ENT "$APP" || true
          fi
          echo "== 签名校验 =="
          codesign -dv --verbose=2 "$APP" 2>&1 || true
          ldid -l "$APP/LibreTV" 2>/dev/null || true

      - name: 打包成 ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/LibreTV.app Payload/
          rm -rf Payload/LibreTV.app/_CodeSignature.bak
          zip -qr LibreTV-unsigned.ipa Payload
          ls -lh LibreTV-unsigned.ipa
          unzip -l LibreTV-unsigned.ipa | head -20

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: LibreTV-ipa
          path: LibreTV-unsigned.ipa
          retention-days: 30
